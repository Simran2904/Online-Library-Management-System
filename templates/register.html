
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Online Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                url("/static/images/1.jpeg");
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .register-container {
            width: 90%;
    max-width: 650px;
    margin: auto;
    padding: 35px;

    background: rgba(255, 255, 255, 0.18);

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;

    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #14213d;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #fca311;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #fca311;
            color: #14213d;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e89400;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #14213d;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            color: #fca311;
        }

        .message {
            background: #fff0f0;
            color: #b00020;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>
        <p class="subtitle">Join our Online Library</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                minlength="8"
                required
            >

            <button type="submit">Register Now</button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{{ url_for('login') }}">Login Here</a>
        </p>

        <p class="bottom-text">
            <a href="{{ url_for('home') }}">Back to Home</a>
        </p>

    </div>

</body>
</html>
